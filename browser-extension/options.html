<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>MAIL HUB 助手 - 配置</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      padding: 40px 20px;
    }
    .container {
      max-width: 480px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    h1 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #1a1a1a;
    }
    .subtitle {
      font-size: 13px;
      color: #999;
      margin-bottom: 24px;
    }
    .form-group { margin-bottom: 20px; }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #333;
      margin-bottom: 6px;
    }
    .form-group input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-group input:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
    }
    .form-group .hint {
      font-size: 11px;
      color: #999;
      margin-top: 4px;
    }
    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    .btn-primary:hover { opacity: 0.9; }
    .btn-test {
      background: #f0f0f0;
      color: #333;
      margin-top: 8px;
    }
    .btn-test:hover { background: #e5e5e5; }
    .status {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      display: none;
    }
    .status.success {
      display: block;
      background: #f6ffed;
      border: 1px solid #b7eb8f;
      color: #52c41a;
    }
    .status.error {
      display: block;
      background: #fff2f0;
      border: 1px solid #ffccc7;
      color: #ff4d4f;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📬 MAIL HUB 助手配置</h1>
    <p class="subtitle">配置你的 MAIL HUB 服务器连接信息</p>

    <div class="form-group">
      <label>服务器地址</label>
      <input type="text" id="serverUrl" placeholder="https://your-mailhub.example.com">
      <div class="hint">例如：http://127.0.0.1:8000 或 https://mailhub.yourdomain.com</div>
    </div>

    <div class="form-group">
      <label>API Key</label>
      <input type="password" id="apiKey" placeholder="mh_xxxxxxxxxxxxxxxx">
      <div class="hint">在 MAIL HUB 后台 data/.api_key 文件中获取，或首次启动自动生成</div>
    </div>

    <div class="form-group">
      <label>默认邮箱池 ID（可选）</label>
      <input type="text" id="defaultPoolId" placeholder="留空使用默认池">
    </div>

    <button class="btn btn-primary" onclick="saveConfig()">💾 保存配置</button>
    <button class="btn btn-test" onclick="testConnection()">🔍 测试连接</button>

    <div class="status" id="status"></div>
  </div>
  <script src="options.js"></script>
</body>
</html>
